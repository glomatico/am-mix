name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive_name: am-mix-windows-x64.zip
            dist_path: dist/pyloid-app
          - os: macos-14
            platform: macos
            archive_name: am-mix-macos-arm64.zip
            dist_path: dist/pyloid-app.app
          - os: ubuntu-24.04
            platform: linux
            archive_name: am-mix-linux-x64.zip
            dist_path: dist/pyloid-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          npm ci
          uv venv
          uv sync --group dev

      - name: Build app
        run: npm run build
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.dist_path }}" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Create archive (macOS)
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.dist_path }}" "${{ matrix.archive_name }}"

      - name: Create archive (Linux)
        if: matrix.platform == 'linux'
        run: |
          dist_name="$(basename "${{ matrix.dist_path }}")"
          (cd dist && zip -r "../${{ matrix.archive_name }}" "$dist_name")

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
